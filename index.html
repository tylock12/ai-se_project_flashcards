<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcards</title>
    <meta name="author" content="Tymon" />
    <meta name="description" content="A flashcard study tool" />
    <meta
      name="keywords"
      content="study aids, flashcards, learning materials"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./assets/css/index.css" />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="#home">Flash Cards</a>
      </h1>
      <nav class="header__nav">
        <ul class="nav__links">
          <li class="nav__item">
            <a class="nav__link" href="#home">Decks</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="#about">About</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="page__main-content">
      <section class="gallery" id="home">
        <h2 class="gallery__title">My Decks</h2>
        <ul class="gallery__list"></ul>
        <button class="gallery__new-card-btn">+ New Deck</button>
        <template id="deck-template">
          <li class="card">
            <a class="card__link" href="#"></a>
            <h3 class="card__title"></h3>
            <div class="card__row">
              <p class="card__count"></p>
              <button
                class="card__delete-btn"
                type="button"
                aria-label="delete this deck"
              ></button>
            </div>
          </li>
        </template>
        <template id="card-template">
          <li class="card">
            <h3 class="card__title"></h3>
            <div class="card__row">
              <button
                type="button"
                aria-label="Flip card"
                class="card__flip-btn"
              ></button>
              <button
                type="button"
                aria-label="Delete card"
                class="card__delete-btn"
              ></button>
            </div>
          </li>
        </template>
      </section>

      <section class="gallery gallery_hidden" id="deck-view">
        <div class="gallery__bar">
          <h2 class="gallery__title"></h2>
          <button type="button" class="gallery__practice-btn">Practice</button>
        </div>
        <ul class="gallery__list"></ul>
        <button
          type="button"
          class="gallery__new-card-btn gallery__new-card-btn_location_deck-view"
        >
          + New Card
        </button>
      </section>

      <section class="new-deck-view new-deck-view_hidden" id="new-deck-view">
        <h2 class="new-deck-view__title">New Deck</h2>
        <form class="new-deck-view__form" id="new-deck-form">
          <fieldset class="new-deck-view__color-picker">
            <legend class="new-deck-view__legend">Pick the deck color</legend>
            <label class="new-deck-view__color-label" for="green">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_green"
                aria-label="Green"
                name="color"
                id="green"
                value="#64D583"
                type="radio"
                checked
              />
            </label>
            <label class="new-deck-view__color-label" for="blue">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_blue"
                aria-label="Blue"
                name="color"
                id="blue"
                value="#91A8F9"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="purple">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_purple"
                aria-label="Purple"
                name="color"
                id="purple"
                value="#AA8EF0"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="pink">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_pink"
                aria-label="Pink"
                name="color"
                id="pink"
                value="#EE92D7"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="orange">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_orange"
                aria-label="Orange"
                name="color"
                id="orange"
                value="#EE955E"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="yellow">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_yellow"
                aria-label="Yellow"
                name="color"
                id="yellow"
                value="#F5D770"
                type="radio"
              />
            </label>
          </fieldset>
          <label class="new-deck-view__json-input">
            <textarea class="new-deck-view__textarea"></textarea>
          </label>
          <button type="submit" class="new-deck-view__submit-btn">
            Create Deck
          </button>
        </form>
      </section>

      <section class="carousel carousel_hidden" id="carousel">
        <h2 class="carousel__title">&middot; 1/10</h2>
        <div class="carousel__grid">
          <button
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
            type="button"
            aria-label="Previous card"
          ></button>
          <div class="carousel__card">
            <p class="carousel__card-text">What is HTML?</p>
          </div>
          <button
            class="carousel__btn carousel__btn_type_right"
            type="button"
            aria-label="Next card"
          ></button>
        </div>
        <button
          class="carousel__btn carousel__btn_type_flip"
          type="button"
          aria-label="Flip card"
        ></button>
      </section>

      <section class="about about_hidden" id="about"></section>

      <section class="not-found not-found_hidden" id="not-found">
        <h2>Page Not Found</h2>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__text">© 2026 Tymon</p>
    </footer>

    <div class="modal" id="deck-error-modal">
      <h2 class="modal__title">Error</h2>
      <p class="modal__message"></p>
      <button class="modal__close" type="button"></button>
    </div>

    <script src="./assets/js/index.js" type="module"></script>
  </body>
</html>
